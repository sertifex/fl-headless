# Used only by the Claude Desktop extension (fl-headless.mcpb, built by tools/make_mcpb.py): Claude's uv reads it to
# set up Python and numpy. fl-headless itself needs nothing else (stdlib + numpy;
# onnxruntime only speeds up piano transcription - same notes - and is limited to Windows x64, so a platform without
# a wheel just runs on numpy). No [build-system]: the code runs
# from the extension folder as it is, nothing gets built or installed as a package.
[project]
name = "fl-headless"
version = "2.3.1"
description = "A patient studio partner for FL Studio: learn it, and make music more easily, by talking to Claude."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "onnxruntime>=1.17; sys_platform == 'win32' and platform_machine == 'AMD64'",
]
